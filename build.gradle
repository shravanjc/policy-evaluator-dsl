plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dep.management)
    alias(libs.plugins.openapi.generator)
}

group = 'com.insurance'
version = '0.0.1-SNAPSHOT'
description = 'Simple project for evaluating a policy based on configured or given DSL'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.toolchain.get().toInteger())
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$rootDir/src/main/resources/openapi.yaml"
    outputDir = layout.buildDirectory.dir('generated').get().asFile.toString()
    apiPackage = 'com.insurance.policy_evaluator_dsl.api'
    modelPackage = 'com.insurance.policy_evaluator_dsl.dto'
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = true
    generateModelDocumentation = true
    configOptions = [
            interfaceOnly        : 'true',
            skipDefaultInterface : 'true',
            useSpringBoot4       : 'true',
            useTags              : 'true',
            openApiNullable      : 'false',
            useJakartaEe         : 'true',
    ]
}

sourceSets {
    main {
        java {
            srcDir layout.buildDirectory.dir('generated/src/main/java')
        }
    }
    itest {
        java.srcDirs = ['src/itest/java']
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += output + compileClasspath
    }
}

compileJava.dependsOn tasks.openApiGenerate
tasks.named('bootRun') { dependsOn tasks.openApiGenerate }

configurations {
    itestImplementation.extendsFrom testImplementation
    itestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation libs.springdoc.openapi.webmvc.ui
    implementation libs.mapstruct
    implementation libs.lombok

    runtimeOnly 'com.h2database:h2'

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    annotationProcessor libs.mapstruct.processor

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.archunit.junit5
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('itest', Test) {
    description = 'Runs integration tests'
    group = 'verification'
    testClassesDirs = sourceSets.itest.output.classesDirs
    classpath = sourceSets.itest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}
