plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dep.management)
    alias(libs.plugins.openapi.generator)
}

group = 'com.insurance'
version = '0.0.1-SNAPSHOT'
description = 'Simple project for evaluating a policy based on configured or given DSL'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.toolchain.get().toInteger())
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$rootDir/src/main/resources/openapi.yaml"
    outputDir = layout.buildDirectory.dir('generated').get().asFile.toString()
    apiPackage = 'com.insurance.policy_evaluator_dsl.generated.api'
    modelPackage = 'com.insurance.policy_evaluator_dsl.generated.dto'
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = true
    generateModelDocumentation = true
    configOptions = [
            interfaceOnly        : 'true',
            skipDefaultInterface : 'true',
            useSpringBoot4       : 'true',
            useTags              : 'true',
            openApiNullable      : 'false',
            useJakartaEe         : 'true',
    ]
}

sourceSets {
    main {
        java {
            srcDir layout.buildDirectory.dir('generated/src/main/java')
        }
    }
    itest {
        java.srcDirs = ['src/itest/java']
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += output + compileClasspath
    }
}

compileJava.dependsOn tasks.openApiGenerate
tasks.named('bootRun') { dependsOn tasks.openApiGenerate }

configurations {
    itestImplementation.extendsFrom testImplementation
    itestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation libs.springdoc.openapi.webmvc.ui
    implementation libs.mapstruct
    implementation libs.lombok

    runtimeOnly 'com.h2database:h2'

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    annotationProcessor libs.mapstruct.processor

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.archunit.junit5
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    itestImplementation libs.rest.assured
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('itest', Test) {
    description = 'Runs integration tests'
    group = 'verification'
    testClassesDirs = sourceSets.itest.output.classesDirs
    classpath = sourceSets.itest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    jvmArgs(
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util.concurrent=ALL-UNNAMED',
        '--add-opens', 'java.base/java.net=ALL-UNNAMED'
    )
}

jacoco {
    toolVersion = "0.8.14"
}

def jacocoExcludes = [
    '**/*Application*',                                      // Spring Boot entry point
    'com/insurance/policy_evaluator_dsl/generated/**',       // Generated OpenAPI API interfaces, DTOs
    'com/insurance/policy_evaluator_dsl/api/mapper',         // Generated Mapstruct mappers
    'com/insurance/policy_evaluator_dsl/infrastructure/config/**' // Other infrastructure
]

jacocoTestReport {
    dependsOn tasks.named('test'), tasks.named('itest')
    executionData(
        layout.buildDirectory.file('jacoco/test.exec'),
        layout.buildDirectory.file('jacoco/itest.exec')
    )
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(
        sourceSets.main.output.classesDirs.collect { dir ->
            fileTree(dir: dir, excludes: jacocoExcludes)
        }
    )
}
