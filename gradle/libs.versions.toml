[versions]
archunit = "1.4.1"
java-toolchain = "25"
mapstruct = "1.6.3"
openapi-generator = "7.20.0"
rest-assured = "6.0.0"
spring-boot = "4.0.3"
spring-dep-management = "1.1.7"
springdoc = "2.6.0"
lombok = "1.18.42"

[libraries]
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dep-management = { id = "io.spring.dependency-management", version.ref = "spring-dep-management" }
